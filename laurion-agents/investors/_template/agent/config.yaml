# Copy investors/_template to investors/<your-investor> and edit.
investor: "Investor Name"
model: claude-opus-5-5
effort: high                # low | medium | high | xhigh | max
server_side_fallbacks: false # off: a declined request fails instead of switching models

# Searched against the archive (only docs published before the as-of date).
# Use the investor's own vocabulary.
retrieval_queries:
  - "competitive advantage durable moat"
  - "valuation intrinsic value margin of safety"
  - "management capital allocation"
  - "why we sold"
passages_per_query: 3

# Worked analyses the investor wrote themselves. Only those published
# before a packet's as-of date are shown. Never use a calibration trade here.
examples: []
#  - path: examples/1985-example.md
#    source: brk-letter-1985
#    date_published: 1986-03-04

# One conversation, one turn per stage. output: text | gate | decision | memo
stages:
  - {id: gatekeeper, prompt: prompts/01_gatekeeper.md, output: gate}
  - {id: business,   prompt: prompts/02_business.md,   output: text}
  - {id: management, prompt: prompts/03_management.md, output: text}
  - {id: valuation,  prompt: prompts/04_valuation.md,  output: text}
  - {id: decision,   prompt: prompts/05_decision.md,   output: decision}
  - {id: memo,       prompt: prompts/06_memo.md,       output: memo}
